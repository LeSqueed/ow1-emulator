name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build workshop code
        run: |
          # Use the committed generated constants instead of regenerating from the JSON
          touch src/constants/hero_roster.opy
          node build.js "$VERSION"
          test -s build/ow1em.txt
          mkdir -p release
          cp build/ow1em.txt "release/ow1-emulator-${VERSION}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ow1-emulator-${{ env.VERSION }}
          path: release/

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## How to import
          1. Download `ow1-emulator-*.txt` below and open it in a text editor.
          2. Select all and copy the contents.
          3. In Overwatch: **Play → Custom Games → Create → Settings**.
          4. Click the **Paste** (import settings) icon in the top right and confirm.
          EOF
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" "release/ow1-emulator-${VERSION}.txt" \
            --title "OW1 Emulator ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
